# Two agents (one Agent item per agent) facing each other along z = 20, 20m apart, with a
# GoodGoal just behind agent 0 (out of both agents' line of sight). Used by tests/test_multi_agent.py.

!ArenaConfig
arenas:
  0: !Arena
    timeLimit: 250
    items:
    - !Item
      name: Agent
      positions:
      - !Vector3 {x: 10, y: 0, z: 20}
      rotations: [90]
    - !Item
      name: Agent
      positions:
      - !Vector3 {x: 30, y: 0, z: 20}
      rotations: [270]
    - !Item
      name: GoodGoal
      positions:
      - !Vector3 {x: 7, y: 0, z: 20}
      rotations: [0]
      sizes:
      - !Vector3 {x: 1, y: 1, z: 1}
