name: Build and Test AAI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      animal_ai_unity_branch:
        description: 'Branch of animal-ai-unity to use'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read      # necessary to read workspace files

# A new push to a PR cancels its in-progress run rather than finishing three Unity builds
# of an outdated commit. Manual runs each get their own group, so they're never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (with the release they correspond
# to in a comment), so a moved or compromised tag can't change what runs here.
jobs:
  test-animal-ai:
    name: Run Unity Tests on animal-ai-unity
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-name: linux
            exe-path: "./build/StandaloneLinux64/StandaloneLinux64.x86_64"
            unity-targetPlatform: "StandaloneLinux64"
          - os: windows-2022
          # The unityci/editor Windows images are Server 2022, which won't run on the
          # Server 2025 windows-latest (ref: https://github.com/game-ci/unity-builder/issues/766)
            os-name: windows
            exe-path: "./build/StandaloneWindows64/StandaloneWindows64.exe"
            unity-targetPlatform: "StandaloneWindows64"
          - os: macos-15-intel
          # Intel (x64) runner, like the retired macos-13 this job used to run on
            os-name: macos
            exe-path: "./build/StandaloneOSX/StandaloneOSX.app"
            unity-targetPlatform: "StandaloneOSX"

    runs-on: ${{ matrix.os }}

    steps:

      # Check out this repo (the PR under test) and animal-ai-python side by side, as
      # pyproject.toml installs animalai from ../animal-ai-python.
      # Nothing here pushes, so don't leave the token in the checkouts' git config.
      - name: Checkout animal-ai-e2e
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: animal-ai-e2e
          persist-credentials: false

      - name: Checkout animal-ai-python
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kinds-of-Intelligence-CFI/animal-ai-python
          path: animal-ai-python
          persist-credentials: false

      - name: Checkout animal-ai-unity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kinds-of-Intelligence-CFI/animal-ai-unity
          path: animal-ai-unity
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.animal_ai_unity_branch || 'main' }}
          persist-credentials: false

      # TODO: If building a new commit, checkout the latest version of the python
      # If building for release, use pip

      # - name: Run EditMode Tests
      #   uses: game-ci/unity-test-runner@v4
      #   env:
      #     UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      #     UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      #     UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      #   with:
      #     projectPath: animal-ai-unity
      #     githubToken: ${{ secrets.GITHUB_TOKEN }}
      #     testMode: EditMode

      # - name: Run PlayMode Tests
      #   uses: game-ci/unity-test-runner@v4
      #   env:
      #     UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      #     UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      #     UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      #   with:
      #     projectPath: animal-ai-unity
      #     githubToken: ${{ secrets.GITHUB_TOKEN }}
      #     testMode: PlayMode

      # Docker is installed on the Windows runners but the daemon isn't running at job start
      # (same readiness step as unity-builder's own Windows workflow)
      - name: Start Docker daemon
        if: matrix.os-name == 'windows'
        timeout-minutes: 2
        shell: powershell
        run: |
          $maxRetries = 10
          for ($i = 0; $i -lt $maxRetries; $i++) {
            $svc = Get-Service docker -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -eq 'Running') {
              docker version 2>$null
              if ($LASTEXITCODE -eq 0) { Write-Host "Docker is ready."; exit 0 }
            }
            if ($svc -and $svc.Status -eq 'Stopped') {
              Write-Host "Docker service stopped, attempting to start..."
              Start-Service docker -ErrorAction SilentlyContinue
            }
            Write-Host "Waiting for Docker daemon (attempt $($i+1)/$maxRetries)..."
            Start-Sleep -Seconds 6
          }
          Write-Error "Docker daemon did not start within $($maxRetries * 6) seconds"
          exit 1

      # v6 downloads and runs the game-ci/cli release named by cliVersion at build time.
      # Pinning cliVersion keeps runs consistent, but tags and release files can still be
      # changed upstream, so builds from this workflow are for testing only, not releases.
      - name: Build AAI
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: animal-ai-unity
          targetPlatform: ${{ matrix.unity-targetPlatform }}
          cliVersion: v0.1.71
          # The default (Semantic) versions the build from GITHUB_SHA, which is this repo's
          # commit, not one in animal-ai-unity, so it fails. Test builds don't need a version.
          versioning: None

      # The Linux build runs in Docker as root, so build/ is root-owned. The player writes next
      # to its executable (e.g. ObservationLogs/), so the runner user needs to own it.
      - name: Make the Linux build writable
        if: matrix.os-name == 'linux'
        run: sudo chown -R "$USER":"$(id -gn)" build

      # uv is pinned to a version this setup-uv release has a checksum for, so the
      # download is verified
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: animal-ai-e2e/uv.lock

      # uv installs the Python version pinned in .python-version
      - name: Install Python dependencies
        working-directory: animal-ai-e2e
        run: uv sync --locked

      - name: Setup Virtual Display
        if: matrix.os-name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run e2e tests (Linux)
        if: matrix.os-name == 'linux'
        env:
          AAI_EXE_PATH: "../${{ matrix.exe-path }}"
          E2E_TEST_PLATFORM: ${{ matrix.os-name }}
        shell: bash
        run: |
          cd animal-ai-e2e
          CUDA_VISIBLE_DEVICES=0 xvfb-run -a uv run pytest tests/ -v

      - name: Run e2e tests (Windows)
        if: matrix.os-name == 'windows'
        env:
          AAI_EXE_PATH: "../${{ matrix.exe-path }}"
          E2E_TEST_PLATFORM: ${{ matrix.os-name }}
        shell: powershell
        run: |
          cd animal-ai-e2e
          $env:CUDA_VISIBLE_DEVICES=0; uv run pytest tests/ -v

      - name: Run e2e tests (macOS)
        id: e2e-macos
        if: matrix.os-name == 'macos'
        env:
          AAI_EXE_PATH: "../${{ matrix.exe-path }}"
          E2E_TEST_PLATFORM: ${{ matrix.os-name }}
        shell: bash
        run: |
          chmod -R 755 ${{ matrix.exe-path }}
          cd animal-ai-e2e
          CUDA_VISIBLE_DEVICES=0 uv run pytest tests/ -v

      # Screenshot test failures, plus the Unity player logs and Inspect logs the tests write
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.os-name }}-test-artifacts
          path: |
            animal-ai-e2e/**/*screenshot_test_dump/**
            animal-ai-e2e/Player-*.log
            animal-ai-e2e/logs/
          if-no-files-found: warn
