name: Build and Test AAI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      animal_ai_unity_branch:
        description: 'Branch of animal-ai-unity to use'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read      # necessary to read workspace files

# A new push to a PR cancels its in-progress run rather than finishing three Unity builds
# of an outdated commit. Manual runs each get their own group, so they're never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (with the release they correspond
# to in a comment), so a moved or compromised tag can't change what runs here.
jobs:
  test-animal-ai:
    name: Run Unity Tests on animal-ai-unity
    strategy:
      fail-fast: false
      # build-name and release-name reproduce the layout of the animal-ai release zips,
      # e.g. Linux.zip contains Linux/animalAI.x86_64 and Linux/animalAI_Data/
      matrix:
        include:
          - os: ubuntu-latest
            os-name: linux
            # unity-builder appends .x86_64 for Linux builds
            build-name: "animalAI"
            release-name: "Linux"
            exe-path: "./build/StandaloneLinux64/animalAI.x86_64"
            unity-targetPlatform: "StandaloneLinux64"
          - os: windows-2022
          # The unityci/editor Windows images are Server 2022, which won't run on the
          # Server 2025 windows-latest (ref: https://github.com/game-ci/unity-builder/issues/766)
            os-name: windows
            build-name: "Animal-AI"
            release-name: "Windows"
            exe-path: "./build/StandaloneWindows64/Animal-AI.exe"
            unity-targetPlatform: "StandaloneWindows64"
          - os: macos-15-intel
          # Intel (x64) runner, like the retired macos-13 this job used to run on
            os-name: macos
            build-name: "MacOS"
            release-name: "MacOS"
            exe-path: "./build/StandaloneOSX/MacOS.app"
            unity-targetPlatform: "StandaloneOSX"

    runs-on: ${{ matrix.os }}

    steps:

      # Check out this repo (the PR under test) and animal-ai-python side by side, as
      # pyproject.toml installs animalai from ../animal-ai-python.
      # Nothing here pushes, so don't leave the token in the checkouts' git config.
      - name: Checkout animal-ai-e2e
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: animal-ai-e2e
          persist-credentials: false

      - name: Checkout animal-ai-python
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kinds-of-Intelligence-CFI/animal-ai-python
          path: animal-ai-python
          persist-credentials: false

      - name: Checkout animal-ai-unity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kinds-of-Intelligence-CFI/animal-ai-unity
          path: animal-ai-unity
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.animal_ai_unity_branch || 'main' }}
          persist-credentials: false

      # TODO: If building a new commit, checkout the latest version of the python
      # If building for release, use pip

      # - name: Run EditMode Tests
      #   uses: game-ci/unity-test-runner@v4
      #   env:
      #     UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      #     UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      #     UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      #   with:
      #     projectPath: animal-ai-unity
      #     githubToken: ${{ secrets.GITHUB_TOKEN }}
      #     testMode: EditMode

      # - name: Run PlayMode Tests
      #   uses: game-ci/unity-test-runner@v4
      #   env:
      #     UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      #     UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      #     UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      #   with:
      #     projectPath: animal-ai-unity
      #     githubToken: ${{ secrets.GITHUB_TOKEN }}
      #     testMode: PlayMode

      # v5 rather than v6: v6 downloads and runs the latest game-ci/cli release at build
      # time, so pinning the action wouldn't pin the code that builds AAI
      - name: Build AAI
        uses: game-ci/unity-builder@adaf7cd8f42fd48fbbf2d4f5f67ca30d87f819f1 # v5.0.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: animal-ai-unity
          targetPlatform: ${{ matrix.unity-targetPlatform }}
          buildName: ${{ matrix.build-name }}

      # Package before the tests run, so files the player writes while testing
      # (e.g. ObservationLogs) don't end up in the zip
      - name: Package build as a release zip
        shell: bash
        env:
          BUILD_DIR: build/${{ matrix.unity-targetPlatform }}
          EXE_PATH: ${{ matrix.exe-path }}
          RELEASE_NAME: ${{ matrix.release-name }}
        run: |
          test -e "$EXE_PATH" || { echo "Expected $EXE_PATH in the build:"; ls -la "$BUILD_DIR"; exit 1; }
          mkdir release
          cp -R "$BUILD_DIR" "release/$RELEASE_NAME"
          # Unity's debug-symbol folders aren't shipped in releases
          rm -rf release/"$RELEASE_NAME"/*_DoNotShip release/"$RELEASE_NAME"/*_ButDontShipItWithYourGame
          cd release
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$RELEASE_NAME.zip" "$RELEASE_NAME"
          else
            # zip -y keeps symlinks (used inside the macOS .app) and Unix permissions
            zip -qry "$RELEASE_NAME.zip" "$RELEASE_NAME"
          fi
          ls -la

      # archive: false uploads the zip as-is, so the artifact downloads as e.g. Linux.zip
      # (the artifact is named after the file) instead of a zip inside a zip
      - name: Upload release zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: release/${{ matrix.release-name }}.zip
          archive: false

      # uv is pinned to a version this setup-uv release has a checksum for, so the
      # download is verified
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: animal-ai-e2e/uv.lock

      # uv installs the Python version pinned in .python-version
      - name: Install Python dependencies
        working-directory: animal-ai-e2e
        run: uv sync --locked

      - name: Setup Virtual Display
        if: matrix.os-name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run e2e tests (Linux)
        if: matrix.os-name == 'linux'
        env:
          AAI_EXE_PATH: "../${{ matrix.exe-path }}"
          E2E_TEST_PLATFORM: ${{ matrix.os-name }}
        shell: bash
        run: |
          cd animal-ai-e2e
          CUDA_VISIBLE_DEVICES=0 xvfb-run -a uv run pytest tests/ -v

      - name: Run e2e tests (Windows)
        if: matrix.os-name == 'windows'
        env:
          AAI_EXE_PATH: "../${{ matrix.exe-path }}"
          E2E_TEST_PLATFORM: ${{ matrix.os-name }}
        shell: powershell
        run: |
          cd animal-ai-e2e
          $env:CUDA_VISIBLE_DEVICES=0; uv run pytest tests/ -v

      - name: Run e2e tests (macOS)
        id: e2e-macos
        if: matrix.os-name == 'macos'
        env:
          AAI_EXE_PATH: "../${{ matrix.exe-path }}"
          E2E_TEST_PLATFORM: ${{ matrix.os-name }}
        shell: bash
        run: |
          chmod -R 755 ${{ matrix.exe-path }}
          cd animal-ai-e2e
          CUDA_VISIBLE_DEVICES=0 uv run pytest tests/ -v

      # Screenshot test failures, plus the Unity player logs and Inspect logs the tests write
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.os-name }}-test-artifacts
          path: |
            animal-ai-e2e/**/*screenshot_test_dump/**
            animal-ai-e2e/Player-*.log
            animal-ai-e2e/logs/
          if-no-files-found: warn
