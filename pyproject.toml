[project]
name = "animal-ai-e2e"
version = "0.1.0"
description = "End-to-end tests for the Animal-AI environment"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "animalai[inspect-ai]",  # inspect-ai for tests/test_llm_scaffold.py
    "numpy",
    "pillow",
    "pytest",
    "scikit-image",  # SSIM for screenshot comparison
]

[tool.uv]
# A test suite, not an installable package
package = false

[tool.uv.sources]
# Test against the sibling animal-ai-python checkout (editable), so local Python changes are picked up.
# Delete this line to use the released animalai package from PyPI instead.
animalai = { path = "../animal-ai-python", editable = true }
